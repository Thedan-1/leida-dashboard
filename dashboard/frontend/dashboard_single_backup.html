<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锅炉安全物联网+监控系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060b1c;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 背景网格 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* 顶部标题栏 */
        .header {
            height: 80px;
            background: linear-gradient(to bottom, rgba(10, 20, 50, 0.95), rgba(10, 20, 50, 0.7));
            border-bottom: 2px solid rgba(59, 130, 246, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            position: relative;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, #60a5fa, #3b82f6, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .header-info {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .header-info span {
            color: #94a3b8;
            font-size: 14px;
            font-family: "Courier New", monospace;
        }

        .header-info .status {
            padding: 6px 16px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            border-radius: 4px;
            color: #10b981;
            font-weight: bold;
        }

        /* 主容器 */
        .main-container {
            display: grid;
            grid-template-columns: 360px 1fr 360px;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 16px;
            padding: 20px;
            height: calc(100vh - 100px);
            position: relative;
            z-index: 1;
        }

        /* 通用面板 */
        .panel {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            padding: 20px;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .panel::before,
        .panel::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
        }

        .panel::before {
            top: -1px;
            left: -1px;
            border-top: 2px solid #3b82f6;
            border-left: 2px solid #3b82f6;
        }

        .panel::after {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid #3b82f6;
            border-right: 2px solid #3b82f6;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 16px;
            padding-left: 12px;
            border-left: 4px solid #3b82f6;
        }

        /* 布局 */
        .left-top { grid-column: 1; grid-row: 1; }
        .left-mid { grid-column: 1; grid-row: 2; }
        .left-bottom { grid-column: 1; grid-row: 3; }

        .center-3d {
            grid-column: 2;
            grid-row: 1 / 4;
            background: rgba(10, 15, 30, 0.85);
            padding: 0;
            overflow: hidden;
        }

        #boiler3d {
            width: 100%;
            height: 100%;
        }

        .boiler-info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 20px;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
        }

        .boiler-info h3 {
            font-size: 18px;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .boiler-info p {
            font-size: 13px;
            color: #94a3b8;
            margin: 4px 0;
        }

        .right-top { grid-column: 3; grid-row: 1; }
        .right-mid { grid-column: 3; grid-row: 2; }
        .right-bottom { grid-column: 3; grid-row: 3; }

        /* 数据卡片 */
        .data-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .data-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(30, 41, 59, 0.3));
            padding: 14px;
            border-radius: 6px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            text-align: center;
        }

        .data-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #60a5fa;
            font-family: "Courier New", monospace;
            margin-bottom: 6px;
        }

        .data-card.success .value { color: #10b981; }
        .data-card.danger .value { color: #ef4444; }

        .data-card .label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        /* 记录列表 */
        .record-list {
            max-height: 100%;
            overflow-y: auto;
        }

        .record-item {
            background: rgba(30, 41, 59, 0.4);
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid #3b82f6;
            border-radius: 4px;
            font-size: 13px;
        }

        .record-item.alert {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .record-item .time {
            color: #60a5fa;
            font-family: monospace;
            font-size: 11px;
        }

        .record-item .content {
            color: #cbd5e1;
            margin-top: 4px;
        }

        .record-list::-webkit-scrollbar {
            width: 6px;
        }

        .record-list::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- 顶部 -->
    <div class="header">
        <h1>锅炉安全物联网+监控系统</h1>
        <div class="header-info">
            <span id="datetime">2026-01-22 14:30:15</span>
            <span class="status">● 系统正常</span>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        
        <!-- 左上 -->
        <div class="panel left-top">
            <div class="panel-title">总体概况</div>
            <div class="data-cards">
                <div class="data-card success">
                    <div class="value">31</div>
                    <div class="label">在线设备</div>
                </div>
                <div class="data-card danger">
                    <div class="value">2</div>
                    <div class="label">告警数</div>
                </div>
                <div class="data-card">
                    <div class="value">15</div>
                    <div class="label">今日巡检</div>
                </div>
                <div class="data-card success">
                    <div class="value">94%</div>
                    <div class="label">完好率</div>
                </div>
            </div>
        </div>

        <!-- 左中 -->
        <div class="panel left-mid">
            <div class="panel-title">排烟温度趋势（12H）</div>
            <div id="chartLine" style="width: 100%; height: calc(100% - 40px);"></div>
        </div>

        <!-- 左下 -->
        <div class="panel left-bottom">
            <div class="panel-title">设备运行状态</div>
            <div id="chartRadar" style="width: 100%; height: calc(100% - 40px);"></div>
        </div>

        <!-- 中间 -->
        <div class="panel center-3d">
            <div class="boiler-info">
                <h3>主控锅炉机组</h3>
                <p>● 运行时长: 1856小时</p>
                <p>● 燃烧效率: 92.3%</p>
                <p>● 实时功率: 8.6MW</p>
            </div>
            <div id="boiler3d"></div>
        </div>

        <!-- 右上 -->
        <div class="panel right-top">
            <div class="panel-title">关键运行参数</div>
            <div id="chartGauge" style="width: 100%; height: calc(100% - 40px);"></div>
        </div>

        <!-- 右中 -->
        <div class="panel right-mid">
            <div class="panel-title">隐患类型分布</div>
            <div id="chartPie" style="width: 100%; height: calc(100% - 40px);"></div>
        </div>

        <!-- 右下 -->
        <div class="panel right-bottom">
            <div class="panel-title">实时告警列表</div>
            <div style="margin-bottom: 10px; display: flex; gap: 8px;">
                <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
                <button onclick="loadJSONFile()" style="padding: 6px 12px; background: rgba(59, 130, 246, 0.8); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">📂 加载JSON数据</button>
                <button onclick="resetToMockData()" style="padding: 6px 12px; background: rgba(100, 116, 139, 0.8); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">🔄 重置模拟数据</button>
            </div>
            <div class="record-list" id="alarmList"></div>
        </div>

    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: rgba(15, 23, 42, 0.95); border: 2px solid #3b82f6; border-radius: 8px; padding: 30px; max-width: 600px; max-height: 80vh; overflow-y: auto; position: relative;">
            <button onclick="closeDetailModal()" style="position: absolute; top: 10px; right: 10px; background: rgba(239, 68, 68, 0.8); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 18px;">×</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        // 确保页面加载完成后执行
        window.addEventListener('DOMContentLoaded', function() {
            initDashboard();
        });

        function initDashboard() {
            // 时间更新
            function updateTime() {
                document.getElementById('datetime').innerText = new Date().toLocaleString('zh-CN');
            }
            setInterval(updateTime, 1000);
            updateTime();

            // 全局变量存储当前数据
            window.currentData = [];
            window.charts = {};

            // 生成模拟数据
            generateMockData();

            // 初始化3D和图表
            init3DBoiler();
            initCharts();
            renderAlarmList();
        }

        function generateMockData() {
            const mockData = [];
            const teams = ['王工', '李工', '张班长', '赵队', '孙师傅'];
            const locations = ['#1号锅炉', '#2号锅炉', '主控机组', '辅助炉', '冷却系统'];
            
            for (let i = 0; i < 18; i++) {
                const isAbnormal = Math.random() > 0.83;
                const temp = 60 + Math.random() * 40;
                mockData.push({
                    id: i,
                    inspector: teams[Math.floor(Math.random() * teams.length)],
                    location: locations[Math.floor(Math.random() * locations.length)],
                    time: new Date(Date.now() - i * 420000).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'}),
                    position: {
                        x: (Math.random() - 0.5) * 4,
                        y: (Math.random() - 0.5) * 4,
                        z: Math.random() * 6 - 3
                    },
                    temp: temp.toFixed(1),
                    pressure: (0.8 + Math.random() * 1.5).toFixed(2),
                    humidity: (20 + Math.random() * 50).toFixed(1),
                    status: isAbnormal ? "告警" : "正常",
                    abnormalType: isAbnormal ? (temp > 90 ? "温度过高" : "压力异常") : null,
                    description: isAbnormal ? "发现异常，需要检查处理" : "设备运行正常",
                    photo: null
                });
            }
            window.currentData = mockData;
        }

        // 3D锅炉
            function init3DBoiler() {
                const container = document.getElementById('boiler3d');
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0f1e);
                
                const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.set(8, 6, 12);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                renderer.shadowMap.enabled = true;
                container.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0x404040, 1.5));
                const spotLight = new THREE.SpotLight(0x60a5fa, 2);
                spotLight.position.set(10, 20, 10);
                spotLight.castShadow = true;
                scene.add(spotLight);

                // 锅炉体
                const boilerGeometry = new THREE.CylinderGeometry(1.5, 1.8, 6, 32);
                const boilerMaterial = new THREE.MeshPhongMaterial({
                    color: 0x1e3a8a,
                    emissive: 0x1e3a8a,
                    emissiveIntensity: 0.2,
                    shininess: 100
                });
                const boiler = new THREE.Mesh(boilerGeometry, boilerMaterial);
                boiler.castShadow = true;
                scene.add(boiler);

                // 锅炉顶盖
                const topGeometry = new THREE.CylinderGeometry(1.5, 1.5, 0.5, 32);
                const topMaterial = new THREE.MeshPhongMaterial({ color: 0x3b82f6, shininess: 100 });
                const top = new THREE.Mesh(topGeometry, topMaterial);
                top.position.y = 3.25;
                scene.add(top);

                // 管道
                const pipeGeometry = new THREE.CylinderGeometry(0.15, 0.15, 4, 16);
                const pipeMaterial = new THREE.MeshPhongMaterial({ color: 0x94a3b8, shininess: 80 });
                
                for (let i = 0; i < 4; i++) {
                    const pipe = new THREE.Mesh(pipeGeometry, pipeMaterial);
                    const angle = (i / 4) * Math.PI * 2;
                    pipe.position.set(Math.cos(angle) * 2, 1, Math.sin(angle) * 2);
                    pipe.rotation.z = Math.PI / 2;
                    scene.add(pipe);
                }

                // 存储场景对象供后续更新
                window.boilerScene = { scene, camera, renderer, boiler, top };

                // 动画循环
                function animate() {
                    requestAnimationFrame(animate);
                    boiler.rotation.y += 0.003;
                    top.rotation.y -= 0.005;
                    renderer.render(scene, camera);
                }
                animate();

                window.addEventListener('resize', () => {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                });

                // 初始渲染数据点
                updateDataPoints();
            }

            // 更新3D场景中的数据点
            window.updateDataPoints = function() {
                const scene = window.boilerScene.scene;
                
                // 清除旧的数据点
                const oldPoints = scene.children.filter(obj => obj.userData.isDataPoint);
                oldPoints.forEach(p => scene.remove(p));

                // 添加新的数据点
                const alertGeometry = new THREE.SphereGeometry(0.15, 16, 16);
                const normalGeometry = new THREE.SphereGeometry(0.1, 16, 16);

                window.currentData.forEach((d, idx) => {
                    const geometry = d.status === "告警" ? alertGeometry : normalGeometry;
                    const material = new THREE.MeshBasicMaterial({ 
                        color: d.status === "告警" ? 0xef4444 : 0x10b981,
                        transparent: true,
                        opacity: d.status === "告警" ? 0.8 : 0.7
                    });
                    
                    const point = new THREE.Mesh(geometry, material);
                    point.position.set(d.position.x, d.position.y, d.position.z);
                    point.userData.isDataPoint = true;
                    point.userData.recordData = d;
                    scene.add(point);
                });
            };
        // ECharts - 折线图
        const chartLine = echarts.init(document.getElementById('chartLine'));
        const hours = Array.from({length: 12}, (_, i) => `${(new Date().getHours() - 11 + i + 24) % 24}:00`);
        const tempData1 = hours.map(() => (70 + Math.random() * 25).toFixed(1));

        chartLine.setOption({
            backgroundColor: 'transparent',
            tooltip: { trigger: 'axis', backgroundColor: 'rgba(0,0,0,0.8)' },
            grid: { left: '8%', right: '5%', top: '10%', bottom: '12%', containLabel: true },
            xAxis: {
                type: 'category',
                data: hours,
                axisLine: { lineStyle: { color: '#334155' } },
                axisLabel: { color: '#94a3b8', fontSize: 10 }
            },
            yAxis: {
                type: 'value',
                axisLine: { lineStyle: { color: '#334155' } },
                splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } },
                axisLabel: { color: '#94a3b8', fontSize: 10 }
            },
            series: [{
                type: 'line',
                data: tempData1,
                smooth: true,
                lineStyle: { color: '#3b82f6', width: 2 },
                itemStyle: { color: '#3b82f6' },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(59, 130, 246, 0.3)' },
                        { offset: 1, color: 'rgba(59, 130, 246, 0)' }
                    ])
                }
            }]
        });

        // ECharts - 雷达图
        const chartRadar = echarts.init(document.getElementById('chartRadar'));
        chartRadar.setOption({
            backgroundColor: 'transparent',
            radar: {
                indicator: [
                    { name: '燃烧效率', max: 100 },
                    { name: '热效率', max: 100 },
                    { name: '设备完整率', max: 100 },
                    { name: '环保达标', max: 100 },
                    { name: '安全指数', max: 100 }
                ],
                splitArea: {
                    areaStyle: {
                        color: ['rgba(59, 130, 246, 0.05)', 'rgba(59, 130, 246, 0.1)']
                    }
                },
                axisLine: { lineStyle: { color: 'rgba(59, 130, 246, 0.3)' } },
                splitLine: { lineStyle: { color: 'rgba(59, 130, 246, 0.3)' } },
                name: { textStyle: { color: '#94a3b8', fontSize: 10 } }
            },
            series: [{
                type: 'radar',
                data: [{
                    value: [92, 88, 94, 87, 91],
                    name: '主控锅炉',
                    areaStyle: {
                        color: new echarts.graphic.RadialGradient(0.5, 0.5, 1, [
                            { offset: 0, color: 'rgba(59, 130, 246, 0.3)' },
                            { offset: 1, color: 'rgba(59, 130, 246, 0.05)' }
                        ])
                    },
                    lineStyle: { color: '#3b82f6', width: 2 },
                    itemStyle: { color: '#60a5fa' }
                }]
            }]
        });

        // ECharts - 仪表盘
        const chartGauge = echarts.init(document.getElementById('chartGauge'));
        chartGauge.setOption({
            backgroundColor: 'transparent',
            series: [
                {
                    type: 'gauge',
                    center: ['25%', '50%'],
                    radius: '70%',
                    startAngle: 200,
                    endAngle: -20,
                    min: 0,
                    max: 100,
                    splitNumber: 5,
                    progress: { show: true, width: 8, itemStyle: { color: '#3b82f6' } },
                    axisLine: { lineStyle: { width: 8, color: [[1, 'rgba(59, 130, 246, 0.2)']] } },
                    axisTick: { show: false },
                    splitLine: { length: 6, lineStyle: { width: 1, color: '#334155' } },
                    axisLabel: { distance: 12, color: '#94a3b8', fontSize: 9 },
                    detail: {
                        valueAnimation: true,
                        formatter: '{value}°C',
                        fontSize: 16,
                        fontWeight: 'bold',
                        color: '#60a5fa',
                        offsetCenter: [0, '60%']
                    },
                    title: {
                        offsetCenter: [0, '80%'],
                        fontSize: 11,
                        color: '#94a3b8'
                    },
                    data: [{ value: 87, name: '排烟温度' }]
                },
                {
                    type: 'gauge',
                    center: ['75%', '50%'],
                    radius: '70%',
                    startAngle: 200,
                    endAngle: -20,
                    min: 0,
                    max: 2.5,
                    splitNumber: 5,
                    progress: { show: true, width: 8, itemStyle: { color: '#10b981' } },
                    axisLine: { lineStyle: { width: 8, color: [[1, 'rgba(16, 185, 129, 0.2)']] } },
                    axisTick: { show: false },
                    splitLine: { length: 6, lineStyle: { width: 1, color: '#334155' } },
                    axisLabel: { distance: 12, color: '#94a3b8', fontSize: 9 },
                    detail: {
                        valueAnimation: true,
                        formatter: '{value}MPa',
                        fontSize: 16,
                        fontWeight: 'bold',
                        color: '#10b981',
                        offsetCenter: [0, '60%']
                    },
                    title: {
                        offsetCenter: [0, '80%'],
                        fontSize: 11,
                        color: '#94a3b8'
                    },
                    data: [{ value: 1.52, name: '蒸汽压力' }]
                }
            ]
        });

        // ECharts - 饼图
        const chartPie = echarts.init(document.getElementById('chartPie'));
        chartPie.setOption({
            backgroundColor: 'transparent',
            tooltip: { trigger: 'item', backgroundColor: 'rgba(0,0,0,0.8)' },
            legend: {
                orient: 'vertical',
                right: 10,
                top: 'center',
                textStyle: { color: '#94a3b8', fontSize: 11 }
            },
            series: [{
                type: 'pie',
                radius: ['40%', '70%'],
                center: ['35%', '50%'],
                avoidLabelOverlap: false,
                itemStyle: {
                    borderRadius: 8,
                    borderColor: '#0f172a',
                    borderWidth: 2
                },
                label: { show: false },
                emphasis: {
                    label: {
                        show: true,
                        fontSize: 14,
                        fontWeight: 'bold',
                        color: '#fff'
                    }
                },
                data: [
                    { value: 1856, name: '正常运行', itemStyle: { color: '#10b981' } },
                    { value: 423, name: '轻微异常', itemStyle: { color: '#f59e0b' } },
                    { value: 98, name: '严重告警', itemStyle: { color: '#ef4444' } },
                    { value: 165, name: '维护中', itemStyle: { color: '#6366f1' } }
                ]
            }]
        });

        // 渲染告警列表
        function renderAlarmList() {
            const alarmList = document.getElementById('alarmList');
            alarmList.innerHTML = '';
            
            window.currentData.filter(d => d.status === "告警").forEach(d => {
                const item = document.createElement('div');
                item.className = 'record-item alert';
                item.style.cursor = 'pointer';
                item.onclick = () => showDetailModal(d);
                item.innerHTML = `
                    <div class="time">${d.time}</div>
                    <div class="content">
                        <strong style="color:#fca5a5;">⚠ ${d.abnormalType || d.issue || '异常'}</strong><br>
                        ${d.inspector} | ${d.location}<br>
                        温度: ${d.temp}°C | 压力: ${d.pressure} MPa
                    </div>
                `;
                alarmList.appendChild(item);
            });
        }

            // 窗口缩放
            window.addEventListener('resize', () => {
                Object.values(window.charts).forEach(chart => chart && chart.resize());
            });
        } // end of initDashboard

        // JSON文件加载
        function loadJSONFile() {
            const input = document.getElementById('jsonFileInput');
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const jsonData = JSON.parse(event.target.result);
                        processJSONData(jsonData);
                        alert(`✅ 成功加载 ${jsonData.records ? jsonData.records.length : 0} 条巡检记录`);
                    } catch (error) {
                        alert('❌ JSON格式错误：' + error.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // 处理JSON数据
        function processJSONData(jsonData) {
            if (!jsonData.records || !Array.isArray(jsonData.records)) {
                alert('❌ JSON格式错误：缺少 records 数组');
                return;
            }

            // 转换JSON数据格式
            window.currentData = jsonData.records.map((record, idx) => ({
                id: record.id || idx,
                inspector: record.inspector || '未知',
                location: record.location || '未知位置',
                time: record.time || new Date().toLocaleTimeString('zh-CN'),
                position: record.position || {x: Math.random()*4-2, y: Math.random()*4-2, z: Math.random()*6-3},
                temp: record.temperature || record.temp || '0',
                pressure: record.pressure || '0',
                humidity: record.humidity || '0',
                status: record.status || '正常',
                abnormalType: record.issue || record.abnormalType,
                description: record.description || '',
                photo: record.photo || null
            }));

            // 更新所有视图
            updateDataPoints();
            renderAlarmList();
            
            // 更新统计卡片
            updateStatCards();
        }

        // 更新统计卡片
        function updateStatCards() {
            const total = window.currentData.length;
            const alerts = window.currentData.filter(d => d.status === '告警').length;
            const normal = total - alerts;
            
            document.querySelector('.left-top .data-cards').innerHTML = `
                <div class="data-card success">
                    <div class="value">${total}</div>
                    <div class="label">检测记录</div>
                </div>
                <div class="data-card danger">
                    <div class="value">${alerts}</div>
                    <div class="label">告警数</div>
                </div>
                <div class="data-card success">
                    <div class="value">${normal}</div>
                    <div class="label">正常记录</div>
                </div>
                <div class="data-card">
                    <div class="value">${((normal/total)*100).toFixed(0)}%</div>
                    <div class="label">完好率</div>
                </div>
            `;
        }

        // 重置为模拟数据
        function resetToMockData() {
            generateMockData();
            updateDataPoints();
            renderAlarmList();
            updateStatCards();
            alert('✅ 已重置为模拟数据');
        }

        // 显示详情弹窗
        function showDetailModal(record) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailContent');
            
            let photoHTML = '';
            if (record.photo) {
                photoHTML = `<img src="${record.photo}" style="width: 100%; max-width: 400px; border-radius: 8px; margin: 15px 0;" onerror="this.style.display='none'">`;
            }
            
            content.innerHTML = `
                <h2 style="color: #60a5fa; margin-bottom: 20px; font-size: 24px;">📋 巡检记录详情</h2>
                <div style="background: rgba(30, 41, 59, 0.6); padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                    <p style="margin: 8px 0; color: #e2e8f0;"><strong>检测人员：</strong>${record.inspector}</p>
                    <p style="margin: 8px 0; color: #e2e8f0;"><strong>检测时间：</strong>${record.time}</p>
                    <p style="margin: 8px 0; color: #e2e8f0;"><strong>检测位置：</strong>${record.location}</p>
                    <p style="margin: 8px 0; color: #e2e8f0;"><strong>坐标：</strong>X: ${record.position.x.toFixed(2)}, Y: ${record.position.y.toFixed(2)}, Z: ${record.position.z.toFixed(2)}</p>
                </div>
                <div style="background: rgba(30, 41, 59, 0.6); padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                    <p style="margin: 8px 0; color: #e2e8f0;"><strong>排烟温度：</strong><span style="color: ${record.temp > 90 ? '#ef4444' : '#10b981'}">${record.temp}°C</span></p>
                    <p style="margin: 8px 0; color: #e2e8f0;"><strong>蒸汽压力：</strong>${record.pressure} MPa</p>
                    <p style="margin: 8px 0; color: #e2e8f0;"><strong>湿度：</strong>${record.humidity}%</p>
                    <p style="margin: 8px 0;"><strong>状态：</strong><span style="color: ${record.status === '告警' ? '#ef4444' : '#10b981'}; font-weight: bold;">${record.status}</span></p>
                </div>
                ${record.abnormalType ? `<div style="background: rgba(239, 68, 68, 0.2); padding: 15px; border-radius: 6px; border-left: 4px solid #ef4444; margin-bottom: 15px;">
                    <p style="margin: 0; color: #fca5a5; font-weight: bold;">⚠ ${record.abnormalType}</p>
                </div>` : ''}
                ${record.description ? `<div style="background: rgba(30, 41, 59, 0.6); padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                    <p style="margin: 0; color: #cbd5e1;"><strong>备注说明：</strong></p>
                    <p style="margin: 10px 0 0 0; color: #94a3b8;">${record.description}</p>
                </div>` : ''}
                ${photoHTML}
            `;
            
            modal.style.display = 'flex';
        }

        // 关闭详情弹窗
        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }
    </script>
</body>
</html>
